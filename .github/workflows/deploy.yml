# Deploys the server functions to Supabase and the website to GitHub Pages
# every time code is pushed to main (or when run by hand from the Actions tab).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  functions:
    name: Supabase functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != ''
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != ''
        with:
          version: latest
      - uses: actions/setup-node@v4
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != ''
        with:
          node-version: 22
      - name: Update database
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != ''
        run: node scripts/migrate.mjs
      - name: Set function settings
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != ''
        run: |
          ORIGIN=$(echo "$SITE_URL" | sed -E 's#^(https?://[^/]+).*#\1#')
          supabase secrets set --project-ref "$PROJECT_REF" SITE_URL="$SITE_URL" ALLOWED_ORIGIN="$ORIGIN"
      - name: Deploy functions
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != ''
        run: |
          for f in create-booking cancel-booking admin-action; do
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
          done

  site:
    name: Website
    needs: functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          BASE_PATH: ${{ vars.BASE_PATH || '/nyc-barbershop/' }}
        run: |
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
